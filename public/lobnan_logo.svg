    <path d="M220 50 C210 20, 195 12, 185 30 C180 38, 182 52, 175 58 C165 66, 145 66, 135 50 C128 38, 132 20, 120 18 C110 16, 100 32, 95 48 C90 62, 75 66, 60 55 C50 48, 48 30, 42 22 C38 16, 32 18, 30 25 C28 35, 34 50, 25 58 C18 64, 10 60, 5 52 C2 47, 0 52, 0 58 C0 68, 15 75, 30 75 C55 75, 70 65, 80 50 C88 38, 95 32, 105 32 C115 32, 118 48, 122 58 C130 72, 155 74, 170 65 C185 55, 188 40, 192 30 C198 18, 212 28, 215 42 C218 55, 210 68, 222 72 C228 74, 235 68, 238 60 Z" fill="#0f375a"/>
    
